  :root{
    --bg:#EEF1F1; --surface:#FFFFFF; --surface-2:#E3E8E7; --line:#C6CECC;
    --ink:#16211F; --ink-dim:#57655F; --ink-faint:#8B9793;
    --accent:#D98324; --accent-strong:#B5670F; --accent-bg:#FBEBD7;
    --ok:#2F7A4F; --ok-bg:#E1F0E5; --warn:#B23A2E; --warn-bg:#F7E3E0;
    --shadow: 0 1px 2px rgba(20,30,28,.06), 0 4px 14px rgba(20,30,28,.05);
    --font: "Roboto", Arial, Helvetica, sans-serif;
    --font-mono: "Roboto Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10161A; --surface:#181F24; --surface-2:#212A30; --line:#333F46;
      --ink:#E8EDEC; --ink-dim:#9FB0AC; --ink-faint:#6C7C78;
      --accent:#E8A24A; --accent-strong:#F0B368; --accent-bg:#3A2A14;
      --ok:#57B77B; --ok-bg:#173324; --warn:#E2695C; --warn-bg:#3A1E1A;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10161A; --surface:#181F24; --surface-2:#212A30; --line:#333F46;
    --ink:#E8EDEC; --ink-dim:#9FB0AC; --ink-faint:#6C7C78;
    --accent:#E8A24A; --accent-strong:#F0B368; --accent-bg:#3A2A14;
    --ok:#57B77B; --ok-bg:#173324; --warn:#E2695C; --warn-bg:#3A1E1A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }

  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); padding-inline:16px; padding-block:18px 60px; overflow-y:auto; }
  .wrap{ max-width:1040px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }

  .app-title{ display:flex; align-items:center; gap:9px; }
  .app-title img{ height:26px; width:auto; border-radius:3px; }
  .app-title span{ font-size:12.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); }

  .toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .tabs{ display:flex; gap:4px; background:var(--surface-2); border-radius:8px; padding:3px; }
  .tab{ font-family:var(--font); font-weight:600; font-size:13px; border:none; background:transparent; color:var(--ink-dim); padding:7px 16px; border-radius:6px; cursor:pointer; }
  .tab[aria-selected="true"]{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .spacer{ flex:1; }
  .btn{ font-family:var(--font); font-weight:600; font-size:13px; border-radius:7px; padding:8px 14px; cursor:pointer; border:1px solid var(--line); background:var(--surface); color:var(--ink); }
  .btn.primary{ background:var(--accent-strong); border-color:var(--accent-strong); color:#fff; }
  .btn.link{ border-color:transparent; background:transparent; color:var(--ink-dim); text-decoration:underline; padding:8px 6px; }
  .btn:active{ transform:translateY(1px); }

  .summary{ display:flex; align-items:center; gap:12px; font-size:12.5px; color:var(--ink-dim); flex-wrap:wrap; }
  .summary b{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--ink); }
  .pill{ font-size:11px; font-weight:600; letter-spacing:.03em; padding:3px 9px; border-radius:99px; }
  .pill.neutral{ background:var(--surface-2); color:var(--ink-dim); }
  .pill.progress{ background:var(--accent-bg); color:var(--accent-strong); }
  .pill.done{ background:var(--ok-bg); color:var(--ok); }
  .bar{ width:110px; height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .bar > i{ display:block; height:100%; background:var(--accent); width:0%; }

  .info-banner{ font-size:12px; background:var(--surface-2); color:var(--ink-dim); border-radius:8px; padding:7px 11px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  .sheet-wrap{ background:#FFFFFF; border:1px solid #9A9A9A; border-radius:4px; overflow-x:auto; box-shadow:var(--shadow); }
  table.sheet{ width:100%; min-width:640px; border-collapse:collapse; font-family:var(--font); color:#1A1A1A; font-size:13px; background:#fff; }
  table.sheet td{ border:1px solid #C7C7C7; padding:7px 10px; vertical-align:middle; }
  col.col-desc{ width:40%; } col.col-chk{ width:70px; } col.col-datos{ width:auto; }

  tr.title-row td{ padding:10px 16px; border:none; border-bottom:2px solid #9A9A9A; background:#fff; }
  .letterhead{ display:flex; align-items:center; justify-content:center; gap:16px; }
  .letterhead img{ height:52px; width:auto; flex:none; }
  .letterhead .doc-title-main{ font-size:19px; font-weight:700; letter-spacing:.01em; color:#1A1A1A; }
  .letterhead .doc-title-sub{ font-size:11.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:#666; margin-top:2px; }
  tr.meta-row td.meta-lbl{ font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:#666; background:#FAFAFA; width:110px; }
  tr.meta-row td.meta-val input{ width:100%; border:none; background:transparent; font:inherit; font-size:14px; color:#1A1A1A; font-family:var(--font); }
  tr.meta-row td.meta-val input[type="date"]{ font-family:var(--font-mono); }
  tr.meta-row td.meta-val input:focus{ outline:none; }

  tr.colhead-row td{ background:#F8F8F8; font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#555; text-align:center; }
  tr.colhead-row td.col-desc-hd{ text-align:left; }

  tr.section-row td{ background:#AEAAAA; font-weight:700; font-size:13.5px; color:#16211F; padding:7px 10px; }
  tr.subhead-row td{ background:#F8F8F8; font-style:italic; font-size:11.5px; color:#666; }
  tr.subhead-row td.chk, tr.subhead-row td.datos{ background:#F8F8F8; }

  tr.item-row.is-checked{ background:#EEF6EE; }
  tr.item-row.is-checked td{ background:#EEF6EE; }
  td.desc{ font-size:13px; }
  td.desc .note{ display:inline-block; margin-left:6px; font-size:10.5px; font-weight:600; color:var(--accent-strong); background:var(--accent-bg); padding:1px 7px; border-radius:99px; vertical-align:1px; }
  td.chk{ text-align:center; cursor:pointer; user-select:none; }
  td.chk input{ position:absolute; opacity:0; width:1px; height:1px; }
  .chk-mark{ display:block; font-size:16px; font-weight:700; color:#1A1A1A; line-height:1; }

  .dfields{ display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; }
  .dfield{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; }
  .dfield b{ font-weight:600; color:#555; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  .dfield select, .dfield input[type="text"]{ font:inherit; font-family:var(--font); font-size:12.5px; border:1px solid #C7C7C7; border-radius:3px; padding:3px 6px; background:#fff; color:#1A1A1A; }
  .dfield input[type="number"]{ font-family:var(--font-mono); font-size:12.5px; border:1px solid #C7C7C7; border-radius:3px; padding:3px 6px; width:64px; background:#fff; color:#1A1A1A; }
  .dfield input.green{ background:#92D050; border-color:#6FA83A; font-weight:600; }
  .dfield .unit{ font-size:10.5px; color:#777; }
  .obs-input{ width:100%; min-height:30px; resize:vertical; border:1px solid #C7C7C7; border-radius:3px; padding:5px 7px; font:inherit; font-family:var(--font); font-size:12.5px; color:#1A1A1A; background:#fff; }
  .static-txt{ font-size:12.5px; color:#333; }
  .static-txt.empty{ color:#A0A0A0; font-style:italic; }

  .transfo-grps{ display:flex; flex-wrap:wrap; gap:10px 20px; }
  .transfo-grp{ display:flex; align-items:center; gap:6px; }
  .transfo-grp b{ font-size:11.5px; font-weight:700; color:#555; margin-right:2px; }
  .phase{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .phase span{ font-size:10px; font-weight:700; background:#FFEB3B; padding:1px 6px; border-radius:2px; color:#1A1A1A; }
  .phase input{ width:46px; text-align:center; font-family:var(--font-mono); font-size:12.5px; border:1px solid #C7C7C7; border-radius:3px; padding:3px 2px; background:#fff; color:#1A1A1A; }

  #view-historial{ display:flex; flex-direction:column; gap:10px; }
  .hist-card{ background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .hist-head{ display:flex; align-items:center; gap:12px; padding:11px 14px; cursor:pointer; flex-wrap:wrap; }
  .hist-date{ font-weight:700; font-size:14.5px; flex:1; min-width:140px; }
  .hist-tech{ font-size:12px; color:var(--ink-faint); }
  .hist-frac{ font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); }
  .hist-detail{ border-top:1px solid var(--line); padding:10px; }
  .hist-actions{ padding:0 14px 12px; display:flex; gap:8px; flex-wrap:wrap; }
  .ghost-btn{ font-family:var(--font); font-weight:600; font-size:12px; background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:6px 11px; cursor:pointer; }
  .empty{ text-align:center; padding:36px 16px; color:var(--ink-faint); font-size:13px; }
  .empty .bolt{ font-size:24px; display:block; margin-bottom:8px; }

  #print-root{ display:none; }

  @media print{
    body{ background:#fff !important; padding:0 !important; }
    .app-title, .toolbar, .summary, .info-banner, #view-hoy, #view-historial{ display:none !important; }
    #print-root{ display:block !important; }
    #print-root .sheet-wrap{ border:none; box-shadow:none; border-radius:0; }
    table.sheet{ min-width:0; font-size:11.5px; }
    table.sheet td{ padding:5px 7px; }
    @page{ size: landscape; margin:10mm; }
  }

  [hidden]{ display:none !important; }
</style>
</head>

  function esc(s){
    s = (s===undefined||s===null) ? '' : String(s);
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function todayStr(){
    var d = new Date();
    var local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
    return local.toISOString().slice(0,10);
  }

  function fmtDateLong(str){
    var p = str.split('-'); if(p.length!==3) return str;
    var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
    var days = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    var months = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    return days[d.getDay()] + ' ' + d.getDate() + ' de ' + months[d.getMonth()] + ' de ' + d.getFullYear();
  }

  function relTime(iso){
    if(!iso) return 'Sin cambios guardados aún';
    var diffMs = Date.now() - new Date(iso).getTime();
    var s = Math.round(diffMs/1000);
    if(s < 10) return 'Guardado justo ahora';
    if(s < 60) return 'Guardado hace ' + s + ' s';
    var m = Math.round(s/60);
    if(m < 60) return 'Guardado hace ' + m + ' min';
    var h = Math.round(m/60);
    if(h < 24) return 'Guardado hace ' + h + ' h';
    return 'Guardado el ' + new Date(iso).toLocaleString('es-CL');
  }

  function defaultValues(){
    var v = {};
    ALL_ITEMS.forEach(function(it){ v[it.id] = {}; });
    return v;
  }

  function newState(date){
    return { date: date, technician: '', status:'draft', updatedAt: null, values: defaultValues() };
  }

  var state = newState(todayStr());
  var saveTimer = null, savePending = false;

  // ---------- completion ----------
  function itemComplete(item, v){
    v = v || {};
    if(item.type === 'transfo'){
      var keys = ['t1r','t1s','t1t','t2r','t2s','t2t'];
      return keys.every(function(k){ return v[k]!==undefined && v[k]!==''; });
    }
    return !!v.checked;
  }

  function computeDone(st){
    var n = 0;
    ALL_ITEMS.forEach(function(it){ if(itemComplete(it, st.values[it.id])) n++; });
    return n;
  }

  function updateSummary(){
    var done = computeDone(state);
    var pct = Math.round((done/TOTAL_UNITS)*100);
    document.getElementById('summary-frac').textContent = done + '/' + TOTAL_UNITS;
    document.getElementById('summary-updated').textContent = savePending ? 'Guardando…' : relTime(state.updatedAt);
    document.getElementById('summary-bar').style.width = pct + '%';
    var pill = document.getElementById('status-pill');
    if(done===0){ pill.className='pill neutral'; pill.textContent='Sin iniciar'; state.status='draft'; }
    else if(done===TOTAL_UNITS){ pill.className='pill done'; pill.textContent='Completo'; state.status='completo'; }
    else { pill.className='pill progress'; pill.textContent='En progreso'; state.status='progreso'; }
  }

  // ---------- editable sheet rendering ----------
  function fieldEditableHtml(itemId, f, val){
    val = (val===undefined||val===null) ? '' : val;
    if(f.kind==='select'){
      var optsHtml = '<option value="">—</option>' + f.options.map(function(o){
        return '<option value="'+esc(o)+'" '+(val===o?'selected':'')+'>'+esc(o)+'</option>';
      }).join('');
      return '<span class="dfield"><b>'+esc(f.label)+'</b><select data-item="'+itemId+'" data-field="'+f.key+'">'+optsHtml+'</select></span>';
    }
    if(f.kind==='number'){
      return '<span class="dfield"><b>'+esc(f.label)+'</b><input type="number" inputmode="decimal" class="'+(f.green?'green':'')+'" placeholder="0" data-item="'+itemId+'" data-field="'+f.key+'" value="'+esc(val)+'"/>'+(f.unit?'<span class="unit">'+esc(f.unit)+'</span>':'')+'</span>';
    }
    return '<span class="dfield"><b>'+esc(f.label)+'</b><input type="text" data-item="'+itemId+'" data-field="'+f.key+'" value="'+esc(val)+'"/></span>';
  }

  function transfoEditableHtml(item, v){
    v = v || {};
    function grp(prefix, label){
      var phases = ['r','s','t'].map(function(ph){
        var k = prefix+ph;
        return '<span class="phase"><span>'+ph.toUpperCase()+'</span><input type="number" inputmode="decimal" placeholder="0" data-item="'+item.id+'" data-field="'+k+'" value="'+esc(v[k]||'')+'"/></span>';
      }).join('');
      return '<span class="transfo-grp"><b>'+label+'</b>'+phases+'</span>';
    }
    return '<div class="transfo-grps">'+grp('t1','Trafo 1')+grp('t2','Trafo 2')+'</div>';
  }

  function checkCellHtml(itemId, checked, hasCheck){
    if(!hasCheck) return '<td class="chk"></td>';
    return '<td class="chk"><input type="checkbox" data-item="'+itemId+'" data-field="checked" '+(checked?'checked':'')+'/><span class="chk-mark">'+(checked?'✔':'')+'</span></td>';
  }

  function itemRowEditable(item, values){
    var v = values[item.id] || {};
    var checked = !!v.checked;
    var noteHtml = item.note ? '<span class="note">'+esc(item.note)+'</span>' : '';
    var rows = '';
    if(item.sub){
      rows += '<tr class="subhead-row"><td class="desc">'+esc(item.sub)+'</td><td class="chk"></td><td class="datos"></td></tr>';
    }
    var datosHtml, hasCheck = true;
    if(item.type==='transfo'){
      hasCheck = false;
      datosHtml = transfoEditableHtml(item, v);
    } else if(item.type==='checkobs'){
      datosHtml = '<textarea class="obs-input" rows="1" placeholder="Sin observaciones" data-item="'+item.id+'" data-field="obs">'+esc(v.obs||'')+'</textarea>';
    } else {
      datosHtml = (item.fields||[]).length ? '<div class="dfields">'+item.fields.map(function(f){ return fieldEditableHtml(item.id, f, v[f.key]); }).join('')+'</div>' : '—';
    }
    rows += '<tr class="item-row'+(hasCheck && checked ? ' is-checked' : '')+'" data-row="'+item.id+'">'
      + '<td class="desc">'+esc(item.label)+noteHtml+'</td>'
      + checkCellHtml(item.id, checked, hasCheck)
      + '<td class="datos">'+datosHtml+'</td>'
      + '</tr>';
    return rows;
  }

  function sectionRowsEditable(section, values){
    return '<tr class="section-row"><td colspan="3">'+esc(section.title)+'</td></tr>'
      + section.items.map(function(it){ return itemRowEditable(it, values); }).join('');
  }

  function headerRowsHtml(){
    return '<tr class="title-row"><td colspan="3"><div class="letterhead">'+LOGO_HTML+'<div><div class="doc-title-main">PAUTA DE CHEQUEO DIARIO</div><div class="doc-title-sub">Electricidad</div></div></div></td></tr>'
      + '<tr class="meta-row"><td class="meta-lbl">Técnico</td><td class="meta-val" colspan="2"><input id="tech-input" type="text" placeholder="Nombre y apellido" autocomplete="off"/></td></tr>'
      + '<tr class="meta-row"><td class="meta-lbl">Fecha</td><td class="meta-val" colspan="2"><input id="date-input" type="date"/></td></tr>'
      + '<tr class="colhead-row"><td class="col-desc-hd"></td><td>Check</td><td>Observaciones</td></tr>';
  }

  function colgroupHtml(){
    return '<colgroup><col class="col-desc"/><col class="col-chk"/><col class="col-datos"/></colgroup>';
  }

  function renderEditableSheet(){
    var html = colgroupHtml() + headerRowsHtml() + SECTIONS.map(function(s){ return sectionRowsEditable(s, state.values); }).join('');
    document.getElementById('sheet-table').innerHTML = html;
    document.getElementById('tech-input').value = state.technician || '';
    document.getElementById('date-input').value = state.date;
    document.getElementById('tech-input').addEventListener('input', onTechInput);
    document.getElementById('date-input').addEventListener('change', onDateChange);
    updateSummary();
  }

  // ---------- static (print / history) rendering ----------
  function fieldStaticHtml(f, val){
    val = (val===undefined||val===null||val==='') ? '' : val;
    return '<span class="dfield"><b>'+esc(f.label)+'</b><span class="static-txt'+(val===''?' empty':'')+'">'+(val===''?'—':esc(val)+(f.unit?' '+esc(f.unit):''))+'</span></span>';
  }

  function transfoStaticHtml(v){
    v = v || {};
    function grp(prefix,label){
      var parts = ['r','s','t'].map(function(ph){
        var k = prefix+ph, val = v[k];
        return '<span class="phase"><span>'+ph.toUpperCase()+'</span><span class="static-txt'+(!val?' empty':'')+'" style="padding-top:3px;">'+(val?esc(val):'—')+'</span></span>';
      }).join('');
      return '<span class="transfo-grp"><b>'+label+'</b>'+parts+'</span>';
    }
    return '<div class="transfo-grps">'+grp('t1','Trafo 1')+grp('t2','Trafo 2')+'</div>';
  }

  function itemRowStatic(item, values){
    var v = values[item.id] || {};
    var checked = !!v.checked;
    var noteHtml = item.note ? '<span class="note">'+esc(item.note)+'</span>' : '';
    var rows = '';
    if(item.sub){
      rows += '<tr class="subhead-row"><td class="desc">'+esc(item.sub)+'</td><td class="chk"></td><td class="datos"></td></tr>';
    }
    var datosHtml, hasCheck = true;
    if(item.type==='transfo'){
      hasCheck = false;
      datosHtml = transfoStaticHtml(v);
    } else if(item.type==='checkobs'){
      var obs = v.obs || '';
      datosHtml = '<span class="static-txt'+(obs?'':' empty')+'">'+(obs?esc(obs):'Sin observaciones')+'</span>';
    } else {
      datosHtml = (item.fields||[]).length ? '<div class="dfields">'+item.fields.map(function(f){ return fieldStaticHtml(f, v[f.key]); }).join('')+'</div>' : '—';
    }
    rows += '<tr class="item-row'+(hasCheck && checked ? ' is-checked' : '')+'">'
      + '<td class="desc">'+esc(item.label)+noteHtml+'</td>'
      + '<td class="chk">'+(hasCheck ? '<span class="chk-mark">'+(checked?'✔':'')+'</span>' : '')+'</td>'
      + '<td class="datos">'+datosHtml+'</td>'
      + '</tr>';
    return rows;
  }

  function sectionRowsStatic(section, values){
    return '<tr class="section-row"><td colspan="3">'+esc(section.title)+'</td></tr>'
      + section.items.map(function(it){ return itemRowStatic(it, values); }).join('');
  }

  function headerRowsStaticHtml(st){
    return '<tr class="title-row"><td colspan="3"><div class="letterhead">'+LOGO_HTML+'<div><div class="doc-title-main">PAUTA DE CHEQUEO DIARIO</div><div class="doc-title-sub">Electricidad</div></div></div></td></tr>'
      + '<tr class="meta-row"><td class="meta-lbl">Técnico</td><td class="meta-val" colspan="2">'+esc(st.technician || '—')+'</td></tr>'
      + '<tr class="meta-row"><td class="meta-lbl">Fecha</td><td class="meta-val" colspan="2">'+esc(fmtDateLong(st.date))+'</td></tr>'
      + '<tr class="colhead-row"><td class="col-desc-hd"></td><td>Check</td><td>Observaciones</td></tr>';
  }

  function renderStaticSheet(container, st){
    var html = colgroupHtml() + headerRowsStaticHtml(st) + SECTIONS.map(function(s){ return sectionRowsStatic(s, st.values); }).join('');
    container.innerHTML = html;
  }

  // ---------- field change handling (editable) ----------
  var sheetTable = document.getElementById('sheet-table');

  function handleFieldChange(e){
    var t = e.target;
    var itemId = t.getAttribute('data-item');
    var field = t.getAttribute('data-field');
    if(!itemId || !field) return;
    if(!state.values[itemId]) state.values[itemId] = {};
    var val = (t.type==='checkbox') ? t.checked : t.value;
    state.values[itemId][field] = val;
    state.updatedAt = new Date().toISOString();
    var row = t.closest('tr[data-row]');
    if(row){
      var it = ALL_ITEMS.find(function(x){ return x.id===itemId; });
      if(it && it.type!=='transfo'){
        row.classList.toggle('is-checked', itemComplete(it, state.values[itemId]));
        var mark = row.querySelector('.chk-mark');
        if(mark) mark.textContent = state.values[itemId].checked ? '✔' : '';
      }
    }
    updateSummary();
    scheduleSave();
  }
  sheetTable.addEventListener('input', handleFieldChange);
  sheetTable.addEventListener('change', handleFieldChange);
  sheetTable.addEventListener('click', function(e){
    var cell = e.target.closest('td.chk');
    if(!cell) return;
    if(e.target.tagName === 'INPUT') return;
    var input = cell.querySelector('input[type="checkbox"]');
    if(input){ input.checked = !input.checked; input.dispatchEvent(new Event('change', {bubbles:true})); }
  });

  function onTechInput(e){
    state.technician = e.target.value;
    state.updatedAt = new Date().toISOString();
    try{ localStorage.setItem('pe_last_tech', state.technician); }catch(err){}
    updateSummary();
    scheduleSave();
  }
  function onDateChange(e){
    var nd = e.target.value || todayStr();
    flushSave().then(function(){ loadDay(nd); });
  }

  document.getElementById('save-btn').addEventListener('click', function(){ scheduleSave(0); });

  document.getElementById('print-btn').addEventListener('click', function(){
    printState(state);
  });

  function printState(st){
    var container = document.getElementById('print-table');
    renderStaticSheet(container, st);
    setTimeout(function(){
      window.print();
    }, 30);
  }

  // ---------- persistence (browser local storage) ----------
  function serializable(){
    return { date: state.date, technician: state.technician || '', status: state.status, updatedAt: state.updatedAt, values: state.values };
  }

  function scheduleSave(delay){
    savePending = true;
    updateSummary();
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, delay===0 ? 0 : 900);
  }

  function flushSave(){
    if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; return doSave(); }
    return Promise.resolve();
  }

  function doSave(){
    saveTimer = null;
    var payload = serializable();
    try{
      localStorage.setItem('checklist_'+payload.date, JSON.stringify(payload));
      var idx = [];
      try{ idx = JSON.parse(localStorage.getItem('checklist_index')||'[]'); }catch(err){}
      if(idx.indexOf(payload.date)===-1){ idx.push(payload.date); idx.sort().reverse(); localStorage.setItem('checklist_index', JSON.stringify(idx)); }
    }catch(err){}
    savePending = false; updateSummary();
    return Promise.resolve();
  }

  function loadDay(date){
    state = newState(date);
    var lastTech = '';
    try{ lastTech = localStorage.getItem('pe_last_tech') || ''; }catch(err){}
    state.technician = lastTech;

    var raw = null;
    try{ raw = localStorage.getItem('checklist_'+date); }catch(err){}
    var data = raw ? JSON.parse(raw) : null;
    if(data){
      state.technician = data.technician || state.technician;
      state.status = data.status || 'draft';
      state.updatedAt = data.updatedAt || null;
      state.values = Object.assign(defaultValues(), data.values || {});
    }
    renderEditableSheet();
  }

  // ---------- history ----------
  function renderHistoryList(entries){
    entries = entries || [];
    var el = document.getElementById('view-historial');
    if(!entries.length){
      el.innerHTML = '<div class="empty"><span class="bolt">⚡</span>Aún no hay pautas guardadas.<br>Completa la de hoy para que aparezca aquí.</div>';
      return;
    }
    var histEntries = {};
    entries.forEach(function(e){ histEntries[e.date] = e; });

    el.innerHTML = entries.map(function(e){
      var done = computeDone(e);
      var pillClass = done===0 ? 'neutral' : (done===TOTAL_UNITS ? 'done' : 'progress');
      var pillTxt = done===0 ? 'Sin iniciar' : (done===TOTAL_UNITS ? 'Completo' : 'En progreso');
      return '<div class="hist-card">'
        + '<div class="hist-head" data-date="'+esc(e.date)+'">'
        + '<div style="flex:1;min-width:160px;"><div class="hist-date">'+esc(fmtDateLong(e.date))+'</div><div class="hist-tech">'+esc(e.technician||'Sin técnico registrado')+'</div></div>'
        + '<div class="hist-frac">'+done+'/'+TOTAL_UNITS+'</div>'
        + '<span class="pill '+pillClass+'">'+pillTxt+'</span>'
        + '</div>'
        + '<div class="hist-detail" id="detail-'+esc(e.date)+'" hidden><div class="sheet-wrap"><table class="sheet"></table></div></div>'
        + '<div class="hist-actions"><button class="ghost-btn" data-toggle="'+esc(e.date)+'">Ver detalle</button><button class="ghost-btn" data-edit="'+esc(e.date)+'">Editar este día</button><button class="ghost-btn" data-print="'+esc(e.date)+'">Imprimir / PDF</button></div>'
        + '</div>';
    }).join('');

    el.querySelectorAll('[data-toggle]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var d = btn.getAttribute('data-toggle');
        var box = document.getElementById('detail-'+d);
        var isHidden = box.hasAttribute('hidden');
        if(isHidden){
          var st = Object.assign(newState(d), histEntries[d], { values: Object.assign(defaultValues(), histEntries[d].values||{}) });
          renderStaticSheet(box.querySelector('table.sheet'), st);
          box.removeAttribute('hidden');
          btn.textContent = 'Ocultar detalle';
        } else {
          box.setAttribute('hidden','');
          btn.textContent = 'Ver detalle';
        }
      });
    });
    el.querySelectorAll('[data-edit]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var d = btn.getAttribute('data-edit');
        switchTab('hoy');
        flushSave().then(function(){ loadDay(d); });
      });
    });
    el.querySelectorAll('[data-print]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var d = btn.getAttribute('data-print');
        var st = Object.assign(newState(d), histEntries[d], { values: Object.assign(defaultValues(), histEntries[d].values||{}) });
        printState(st);
      });
    });
  }

  function startHistory(){
    var idx = [];
    try{ idx = JSON.parse(localStorage.getItem('checklist_index')||'[]'); }catch(err){}
    var entries = idx.map(function(d){
      try{ return JSON.parse(localStorage.getItem('checklist_'+d)); }catch(err){ return null; }
    }).filter(Boolean).sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    renderHistoryList(entries);
  }

  // ---------- tabs ----------
  function switchTab(name){
    var hoy = name==='hoy';
    document.getElementById('view-hoy').hidden = !hoy;
    document.getElementById('view-historial').hidden = hoy;
    document.getElementById('tab-hoy').setAttribute('aria-selected', hoy);
    document.getElementById('tab-historial').setAttribute('aria-selected', !hoy);
    document.getElementById('summary-line').style.display = hoy ? '' : 'none';
    if(!hoy){ startHistory(); }
  }
  document.getElementById('tab-hoy').addEventListener('click', function(){ switchTab('hoy'); });
  document.getElementById('tab-historial').addEventListener('click', function(){ switchTab('historial'); });

  // ---------- lifecycle ----------
  document.addEventListener('visibilitychange', function(){ if(document.hidden) flushSave(); });
  window.addEventListener('beforeunload', function(){ if(saveTimer) doSave(); });

  loadDay(todayStr());
})();
</script>
</body>
</html>
